<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOS 편성 계산기 — 조이너·위젯·칸 진단</title>
<meta name="description" content="화이트아웃 서바이벌 랠리/개리슨 편성 계산기. 리더 3명과 병비를 넣으면 SkillMod 칸 포화, 위젯 발동, 병종 전용 스킬 사망 여부, 조이너 한계 배율 순위를 자동 계산합니다.">
<style>
:root{--bg:#0f1420;--card:#171e2e;--card2:#1e2740;--line:#2b3650;--ink:#e8edf7;--sub:#9aa8c4;--muted:#6f7d9b;
--pick:#2fbf71;--pick-bg:#12321f;--skip:#e5567a;--skip-bg:#33131f;--cond:#e6b23a;--cond-bg:#332913;
--accent:#5b9dff;--accent-bg:#122544;--lance:#b98bff;--lance-bg:#241a3a;--star:#ffd45e;--star-bg:#332b0e;
--inf:#5bd6c0;--mk:#ff9d5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:13px;margin-bottom:20px}
.sub a{color:var(--accent);text-decoration:none}
h2{font-size:17px;margin:28px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
h2 span{color:var(--muted);font-size:12.5px;font-weight:400;margin-left:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
select,input{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:end}
.ratio3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:none;color:var(--sub);padding:9px 20px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
thead th{background:var(--card2);color:var(--sub);text-align:left;padding:8px 10px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{background:var(--card)}
tbody tr:hover{background:var(--card2)}
tr.hi{background:var(--star-bg)!important}
tr.dead td{opacity:.5}
.b{font-weight:700;color:#fff}
.big{font-weight:700;color:var(--star)}
.cap{color:var(--sub);font-size:12px}
.note{color:var(--muted);font-size:12px}
/* 영웅 초상 — img/heroes/<id>.webp (96px webp, 장당 4KB).
   못 불러오면 onerror 로 지운다. 그림이 없어도 계산기는 그대로 동작해야 한다. */
.hpic{width:34px;height:34px;border-radius:8px;vertical-align:middle;margin-right:8px;
 background:#1a2030;border:1px solid #2b3550;object-fit:cover;flex:0 0 auto}
.hpic.sm{width:24px;height:24px;border-radius:6px;margin-right:6px}
.hpic.lg{width:44px;height:44px}
.hrow{display:flex;align-items:center;gap:0}
/* 초상 픽커 — 상태는 숨은 <select> 가 들고 있고, 이건 그 위에 얹은 화면일 뿐이다.
   <details> 를 쓰는 이유: 열고 닫기·키보드·모바일이 브라우저 기본 동작으로 해결된다. */
.pick{min-width:0;position:relative}
.pick>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
 padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card2);
 color:var(--ink);font-size:13px;min-height:38px}
.pick>summary::-webkit-details-marker{display:none}
.pick>summary::after{content:"▾";margin-left:auto;color:var(--sub);font-size:11px}
.pick[open]>summary{border-color:var(--accent)}
.pick[open]>summary::after{content:"▴"}
.pick>summary .cap{font-size:11px}
/* 격자는 팝오버로 띄운다. 흐름에 두면 리더 칸 폭(2열)에 갇히고, 열 때마다
   옆의 전무 입력이 아래로 밀린다. */
.pgrid{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:min(560px,calc(100vw - 40px));
 display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;
 max-height:400px;overflow:auto;padding:9px;border:1px solid var(--line);border-radius:12px;
 background:var(--card);box-shadow:0 14px 36px rgba(0,0,0,.55)}
.pick.right .pgrid{left:auto;right:0}
@media(max-width:720px){.pgrid{width:calc(100vw - 32px);left:0;right:auto}
 .pick.right .pgrid{left:0;right:auto}}
.pk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 9px;border:1px solid var(--line);
 border-radius:12px;background:var(--card2);color:var(--ink);font:inherit;cursor:pointer;text-align:center;
 min-height:124px;justify-content:flex-start;transition:border-color .12s,background .12s,transform .12s}
.pk:hover{background:#243052;border-color:#3d4c72;transform:translateY(-1px)}
.pk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pk[aria-pressed="true"]{border-color:var(--accent);background:#16233c;box-shadow:0 0 0 1px var(--accent) inset}
.pk .hpic{width:64px;height:64px;border-radius:12px;margin:0}
.pk b{font-size:12.5px;font-weight:700;line-height:1.2;word-break:keep-all}
.pk i{font-size:10.5px;font-style:normal;color:var(--muted);display:flex;gap:4px;align-items:center;justify-content:center}
.pk .t-ok{margin:0;padding:0 5px;font-size:9.5px}
.pk.none{min-height:124px;justify-content:center;color:var(--sub);font-size:12px;border-style:dashed}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:21px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:800;margin-right:6px}
.s-A{background:#3a2a0e;color:#ffd45e;border:1px solid #6b571b}
.s-B{background:#122544;color:#5b9dff;border:1px solid #25467c}
.s-E{background:#241a3a;color:#b98bff;border:1px solid #4a3a6b}
.s-F{background:#33131f;color:#ff8fa8;border:1px solid #6b2338}
.s-G{background:#331f0e;color:#ff9d5b;border:1px solid #6b3d1b}
.s-C{background:#12321f;color:#2fbf71;border:1px solid #1c5c38}
.s-D{background:#0e2f33;color:#5bd6c0;border:1px solid #1b5c5c}
.s-X{background:#242a38;color:#9aa8c4;border:1px solid #38425c}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;white-space:nowrap;margin-left:4px}
.t-ok{background:var(--pick-bg);color:var(--pick);border:1px solid #1c5c38}
.t-bad{background:var(--skip-bg);color:var(--skip);border:1px solid #6b2338}
.t-warn{background:var(--cond-bg);color:var(--cond);border:1px solid #6b571b}
.t-off{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
/* ⑤ 원본 표의 우선순위 번호 */
.ono{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
 border-radius:50%;font-size:10.5px;font-style:normal;font-weight:800;margin-right:6px;
 background:var(--card2);border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
.ono.on{background:var(--skip-bg);border-color:#6b2338;color:#ff8fa8}
td.cdone{opacity:.45}
.ck{font-style:normal;color:var(--pick);margin-left:5px;font-size:11px}
.callout{border-radius:13px;padding:14px 16px;margin:12px 0;border:1px solid}
.co-key{background:var(--star-bg);border-color:#6b571b}
.co-tip{background:var(--accent-bg);border-color:#25467c}
.co-warn{background:var(--skip-bg);border-color:#6b2338}
.co-ok{background:var(--pick-bg);border-color:#1c5c38}
.callout h3{margin:0 0 6px;font-size:14px}
.co-key h3{color:var(--star)}.co-tip h3{color:var(--accent)}.co-warn h3{color:var(--skip)}.co-ok h3{color:var(--pick)}
.callout p{margin:5px 0;font-size:13px}
.callout ul{margin:5px 0 0;padding-left:19px;font-size:13px}
.bar{height:7px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:4px;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2fbf71,#e6b23a,#e5567a)}
.chip{display:inline-block;font-size:11px;padding:3px 9px;margin:4px 4px 0 0;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--sub);cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--accent);color:#fff}
.sumwarn{font-size:11px;margin-top:5px;color:var(--skip)}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--sub);margin:0 4px 4px 0}
footer{margin-top:36px;color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--accent);text-decoration:none}
/* ── 장비 탭 ────────────────────────────────────────────────────────
   새 색을 만들지 않는다. 위의 CSS 변수만 쓴다. */
/* 12조각 입력 — 병종 3줄(보→창→궁) × 슬롯 4장 카드.
   행 순서는 화면 전용이다. 엔진 타이브레이크의 GEAR_TROOP_ORDER 와 별개다. */
.gwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(322px,100%),1fr));gap:14px;margin-top:8px}
.gsec{min-width:0}
.gsec>h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:8px;font-weight:700}
.gsec>h4 .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.gsec>h4 span{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.3px}
/* 병종 한 칸 안에서 헬멧·장갑 / 벨트·신발 두 줄 — 좌(헬멧·벨트)·우(장갑·신발) 가 세로로 맞는다 */
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.gcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 11px 10px}
.gcard.main{border-color:#3d4c72}
.gcard>header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gcard>header svg{width:21px;height:21px;flex:0 0 auto;color:var(--sub)}
.gcard.main>header svg{color:var(--accent)}
.gcard>header b{font-size:13px;font-weight:700}
.sidep{margin-left:auto;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;
 border:1px solid var(--line);color:var(--sub);background:var(--card)}
.sidep.l{color:var(--accent);border-color:#25467c}
.sidep.r{color:var(--lance);border-color:#4a3a6b}
.gcell{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gcell input{padding:6px 4px;font-size:13px;text-align:center}
.gcell input.over{border-color:var(--skip);color:var(--skip)}
/* 마일스톤 트랙 — 원정(실전)과 탐험(통행료)을 눈금 색으로 갈라 놓는다 */
.ms{position:relative;height:6px;border-radius:3px;background:var(--card);
 border:1px solid var(--line);margin-top:10px}
.ms.off{opacity:.4}
.ms>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.ms>b{position:absolute;top:-4px;width:2px;height:12px;border-radius:1px;
 background:var(--muted);transform:translateX(-1px)}
/* 눈금 색이 곧 이 병종에게의 값이다 — 필요 / 보조 / 통행료(축 안 맞음·아레나) */
.ms>b.g-need{background:var(--star);width:3px;transform:translateX(-1.5px)}
.ms>b.g-sub{background:var(--cond);width:3px;transform:translateX(-1.5px)}
.ms>b.on{opacity:.4}
.msn{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1px 8px;font-size:10.5px;color:var(--muted);margin-top:5px}
.mslegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:13px;font-size:11.5px;color:var(--muted)}
.mstag{display:flex;align-items:center;gap:6px}
.mstag i{width:3px;height:12px;border-radius:1px;flex:0 0 auto;background:var(--muted)}
.mstag i.g-need{background:var(--star)}
.mstag i.g-sub{background:var(--cond)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.tiles>div{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.tiles b{display:block;font-size:20px;font-weight:800;color:var(--star);line-height:1.35}
.tiles>div.bn{border-color:#6b2338;background:var(--skip-bg)}
.tiles>div.bn b{color:var(--skip)}
.tiles span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.gchk{width:16px;height:16px;padding:0;accent-color:var(--accent);cursor:pointer}
tbody tr.done td{opacity:.42}
input[type=range]{padding:0;accent-color:var(--accent);background:none;border:none}
.gio{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.gio .chip{margin:0}
.xscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 순서표는 열이 열 개다. 긴 설명이 들어가는 '작업' 칸이 폭을 다 먹어서 조각 이름이
   공백에서 두 줄로 접혔다(1400px 에서도 71px). 나머지 칸은 안 접고, 접혀도 되는 건
   '작업' 칸 하나뿐이다. 넘치면 .xscroll 이 표만 가로로 굴린다. */
#tab-gear table th,#tab-gear table td{white-space:nowrap}
#gSteps td.work,#gSteps td.work .note{white-space:normal;min-width:190px}
#tab-gear table .cap{white-space:normal;min-width:0}
.pc{white-space:nowrap}
.xscroll>table{min-width:520px}
textarea{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);
 border-radius:9px;padding:9px 10px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;
 min-height:120px;margin-top:8px}
@media(max-width:700px){.gwrap{gap:12px}.gcards{gap:8px}.gcard{padding:9px 9px 9px}}
@media(max-width:700px){table{font-size:12px}.ratio3{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div style="display:flex;justify-content:flex-end"><span class="seg" style="margin-bottom:6px"><button id="lgKo" class="on">한국어</button><button id="lgEn">English</button></span></div>
<h1 id="h1"></h1>
<div class="sub" id="sub"></div>

<div class="seg" style="margin-bottom:14px"><button id="tabComp" class="on"></button><button id="tabGear"></button></div>

<div id="tab-comp">

<div class="panel">
  <div style="margin-bottom:14px"><span class="seg"><button id="mAtk" class="on"></button><button id="mDef"></button></span></div>
  <div class="grid">
    <div><label id="lbInf"></label><div class="row2"><details class="pick" id="pInf"><summary id="sInf"></summary><div class="pgrid" id="gInf"></div></details><input id="wInf" type="number" min="0" max="10" value="10" title="전무 레벨"></div><select id="hInf" hidden></select></div>
    <div><label id="lbLan"></label><div class="row2"><details class="pick" id="pLan"><summary id="sLan"></summary><div class="pgrid" id="gLan"></div></details><input id="wLan" type="number" min="0" max="10" value="10" title="전무 레벨"></div><select id="hLan" hidden></select></div>
    <div><label id="lbMar"></label><div class="row2"><details class="pick right" id="pMar"><summary id="sMar"></summary><div class="pgrid" id="gMar"></div></details><input id="wMar" type="number" min="0" max="10" value="10" title="전무 레벨"></div><select id="hMar" hidden></select></div>
  </div>
  <div style="margin-top:14px" class="grid">
    <div><label id="lbMine"></label><div class="ratio3"><input id="r1" type="number" value="48" placeholder="보"><input id="r2" type="number" value="4" placeholder="창"><input id="r3" type="number" value="48" placeholder="궁"></div><div id="rPre"></div><div id="rSum" class="sumwarn"></div></div>
    <div><label id="eLab">상대 방어 병비 (선택)</label><div class="ratio3"><input id="e1" type="number" placeholder="보"><input id="e2" type="number" placeholder="창"><input id="e3" type="number" placeholder="궁"></div><div id="ePre"></div><div id="eSum" class="sumwarn"></div></div>
    <div><label id="lbGcap"></label><select id="gcap"></select></div>
  </div>
  <div class="note" style="margin-top:10px" id="assump"></div>
</div>

<div id="out"></div>
</div><!-- /tab-comp -->

<div id="tab-gear" hidden>
  <div class="panel">
    <div class="grid">
      <div><label id="gLbAtk"></label><div class="ratio3"><input id="ga1" type="number" value="48"><input id="ga2" type="number" value="4"><input id="ga3" type="number" value="48"></div><div id="gaPre"></div><div id="gaSum" class="sumwarn"></div></div>
      <div><label id="gLbDef"></label><div class="ratio3"><input id="gd1" type="number" value="60"><input id="gd2" type="number" value="40"><input id="gd3" type="number" value="0"></div><div id="gdPre"></div><div id="gdSum" class="sumwarn"></div></div>
    </div>
    <div class="grid" style="margin-top:14px">
      <div><label id="gLbAW"></label><input id="gAW" type="range" min="0" max="1" step="0.05" value="0.75"><div class="note" id="gAWn"></div></div>
      <div><label id="gLbArena"></label><div><span class="seg" id="gArena"><button type="button" data-v="none" class="on"></button><button type="button" data-v="low"></button><button type="button" data-v="high"></button></span></div><div class="note" id="gArenaN"></div></div>
      <div><label id="gLbWk"></label><input id="gWk" type="number" min="0" max="999" value="2"><div id="gWkPre"></div></div>
    </div>
  </div>

  <div class="panel">
    <label id="gLbGrid"></label>
    <div id="gGrid"></div>
    <div id="gGridLegend" class="mslegend"></div>
    <div class="note" id="gGridCap" style="margin-top:10px"></div>
    <div id="gGridWarn" class="sumwarn"></div>
    <div class="gio"><button type="button" class="chip" id="gExport"></button><button type="button" class="chip" id="gImport"></button><button type="button" class="chip" id="gApply"></button><button type="button" class="chip" id="gClear"></button><span class="note" id="gIoMsg"></span></div>
    <textarea id="gJson" spellcheck="false" hidden></textarea>
  </div>

  <div id="gOutTop"></div>

  <div class="panel" id="gBudgetBox">
    <label id="gLbBudget"></label>
    <input id="gBudget" type="range" min="0" max="100" step="10" value="100">
    <div class="note" id="gBudgetN"></div>
  </div>

  <div id="gOutBot"></div>
</div>
<footer>
<span id="srcData"></span><br>
<span id="srcModel"></span>
</footer>
</div>
<script>
